.get-branch-script: &get-branch-script
  # CI_COMMIT_BRANCH在PR和tag事件中无效，需要单独处理
  - if [ -z $CI_COMMIT_BRANCH ]; then export CI_COMMIT_BRANCH=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME; fi
  # tag事件只能取默认分支：因为tag与分支并无一对一关系
  - if [ -z $CI_COMMIT_BRANCH ]; then export CI_COMMIT_BRANCH=$CI_DEFAULT_BRANCH; fi

# gitlab pipelines
default:
  interruptible: true
  # 指定runner的tag
  tags:
    - alpha

variables:
  GIT_DEPTH: 1
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  PRODUCTION_TAG_REG: '/^v[0-9]+(\.[0-9]+){2,3}$/'
  BUILD_NAME: stardust
  UNITY_ACTIVATION_FILE: ./unity3d.alf
  UNITY_VERSION: "2022.3.7f1"
  IMAGE: unityci/editor # https://hub.docker.com/r/unityci/editor
  IMAGE_VERSION: 1 # This will automatically use latest v1.x.x, see https://github.com/game-ci/docker/releases
  UNITY_DIR: $CI_PROJECT_DIR # this needs to be an absolute path. Defaults to the root of your tree.
  # You can expose this in Unity via Application.version
  VERSION_NUMBER_VAR: $CI_COMMIT_REF_SLUG-$CI_PIPELINE_ID-$CI_JOB_ID
  VERSION_BUILD_VAR: $CI_PIPELINE_IID

image: $IMAGE:$UNITY_VERSION-base-$IMAGE_VERSION

stages:
  - prepare
  - deploy
  - publish
  - prerelease reverie
  - release

workflow:
  rules:
    # 不处理draft的事件
    - if: $CI_COMMIT_MESSAGE =~ /^draft/i
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_JOB_MANUAL
    - if: $CI_PIPELINE_SOURCE == "schedule"

test:prepare:
  stage: .pre
  image: ccr.ccs.tencentyun.com/solution/docker:20.10.15-alpine3.15
  before_script:
    - docker system prune --force --volumes || true
    - mkdir -p /results/$CI_PIPELINE_ID
    - *get-branch-script
    - echo "CI_COMMIT_BRANCH=$CI_COMMIT_BRANCH" > .env
    - echo $CI_PIPELINE_SOURCE
    - echo $PACKAGE_MANAGER_SET
  script:
    - echo $CI_PIPELINE_ID
  artifacts:
    reports:
      dotenv: .env

test:summary:
  stage: .post
  variables:
    GIT_STRATEGY: none
  dependencies:
    - test:prepare
  image: ccr.ccs.tencentyun.com/solution/python-requests:2.7.18-alpine3.11
  before_script:
    - echo $CI_COMMIT_BRANCH
  script:
    - trap 'rm -rf  /results/$CI_PIPELINE_ID' EXIT
  when: always


.deploy: &deploy
  stage: deploy
  trigger:
    include: .gitlab/ci/build-deploy.gitlab-ci.yml
    strategy: depend
  rules:
    - if: $CI_ENVIRONMENT_NAME && $CI_PIPELINE_SOURCE != "schedule"
      when: manual
  allow_failure: true

deploy/test:
  <<: *deploy
  variables:
    CI_ENVIRONMENT_NAME: test
  rules:
    - if: $CI_COMMIT_TAG
    
prerelease:reverie:
  stage: prerelease reverie
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo 'running release_job'
    - echo 'Previous Job ID is printed below'
    - echo $GE_JOB_ID
    - echo "Publishing artifacts to release ${CI_COMMIT_TAG}..."
  release:
    name: '${CI_COMMIT_TAG}'
    description: 'Created using the release-cli'
    tag_name: '${CI_COMMIT_TAG}'
    assets:
      links:
        - name: 'stardust-${CI_COMMIT_TAG}'
          url: 'https://gitlab.deepglint.com/alpha/stardust_reverie/-/jobs/${GE_JOB_ID}/artifacts/download'
  rules:
    - if: $CI_COMMIT_TAG

release:push:
  stage: release
  image: 
    name: ccr.ccs.tencentyun.com/solution/python-gitlab:v3.15.0
    entrypoint: [""]
  script:
    - pip install --trusted-host package.nemoface.com -i http://package.nemoface.com/repository/pypi/simple gitbot
    - git-release
  rules:
    - if: $CI_COMMIT_TAG

get-unity-version:
  image: alpine
  stage: prepare
  variables:
    GIT_DEPTH: 1
  script:
    - echo UNITY_VERSION=$(cat $UNITY_DIR/engine/ProjectSettings/ProjectVersion.txt | grep "m_EditorVersion:.*" | awk '{ print $2}') | tee prepare.env
  artifacts:
    reports:
      dotenv: prepare.env

.unity_before_script: &unity_before_script
  before_script:
    - chmod +x ./engine/ci/before_script.sh && ./engine/ci/before_script.sh
  needs:
    - job: get-unity-version
      artifacts: true

.cache: &cache
  cache:
    key: "$CI_PROJECT_NAMESPACE-$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG-$TEST_PLATFORM"
    paths:
      - $UNITY_DIR/Library/

.license: &license
  rules:
    - if: '$UNITY_LICENSE != null'
      when: always

.unity_defaults: &unity_defaults
  <<:
    - *unity_before_script
    - *cache
    - *license

get-activation-file:
  <<: *unity_before_script
  rules:
    - if: '$UNITY_LICENSE == null'
      when: manual
  stage: prepare
  script:
    - chmod +x ./engine/ci/get_activation_file.sh && ./engine/ci/get_activation_file.sh
  artifacts:
    paths:
      - $UNITY_ACTIVATION_FILE
    expire_in: 10 min # Expiring this as artifacts may contain sensitive data and should not be kept public

npm_publish:
  stage: publish
  image: node:18.12.1-alpine3.15
  script:
    - cd ./Assets
    - npm config set registry http://package.nemoface.com/repository/unity
    - echo "//package.nemoface.com/repository/:_authToken=\${CI_NPM_TOKEN}" >> ~/.npmrc
    - npm publish
  rules:
    - if: $CI_COMMIT_TAG

build_package:
  stage: publish
  <<: *unity_defaults
  script:
    - cd engine/ci
    - chmod +x ./build_package.sh && ./build_package.sh
  artifacts:
    paths:
      - $UNITY_DIR/engine/Packages/
    name: stardust
  tags:
    - alpha
